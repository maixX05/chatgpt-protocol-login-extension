<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Protocol Login</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">PROTOCOL LOGIN</p>
          <h1>ChatGPT 账号</h1>
        </div>
        <span id="account-count" class="count-badge">0</span>
      </header>

      <section id="task-panel" class="task-panel" aria-live="polite" hidden>
        <div class="task-copy">
          <span id="task-status" class="status-mark">运行中</span>
          <strong id="task-email"></strong>
          <p id="task-message"></p>
        </div>
        <button id="cancel-login" class="button button-quiet" type="button">停止</button>
      </section>

      <div class="toolbar">
        <button id="show-import" class="button button-primary" type="button">导入账号</button>
        <button id="clear-accounts" class="button button-quiet" type="button">清空</button>
      </div>

      <label class="search-field" for="account-search">
        <span class="visually-hidden">搜索邮箱</span>
        <input id="account-search" type="search" placeholder="搜索邮箱" autocomplete="off">
      </label>

      <section id="import-panel" class="import-panel" hidden>
        <label for="account-text">邮箱----密码----2FA</label>
        <textarea id="account-text" rows="7" spellcheck="false" autocomplete="off"></textarea>
        <div class="file-row">
          <input id="account-file" type="file" accept=".txt,text/plain">
        </div>
        <div id="import-errors" class="import-errors" role="alert" hidden></div>
        <div class="panel-actions">
          <button id="hide-import" class="button button-quiet" type="button">取消</button>
          <button id="import-accounts" class="button button-primary" type="button">确认导入</button>
        </div>
      </section>

      <section aria-labelledby="account-list-title">
        <div class="section-heading">
          <h2 id="account-list-title">账号列表</h2>
          <span id="global-message" role="status" aria-live="polite"></span>
        </div>
        <div id="empty-state" class="empty-state">
          <strong>暂无账号</strong>
        </div>
        <ul id="account-list" class="account-list" aria-label="ChatGPT 账号"></ul>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
